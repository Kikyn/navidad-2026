<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¡La Navidad Llegó a Casa! 2026</title>
  <meta property="og:title" content="🎄 ¡La Navidad Llegó a Casa! 2026" />
  <meta property="og:description" content="Toca el enlace para abrir tu sobre navideño y ver todos los detalles." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://kikyn.github.io/navidad-2026/invitacion.jpg" />
  <meta property="og:image:width" content="1080" />
  <meta property="og:image:height" content="1920" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #5c0c12 0%, #240407 70%, #120203 100%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      padding: 20px;
      color: #fff;
    }

    .snow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 80px 120px, #ffd700, rgba(0,0,0,0)),
        radial-gradient(3px 3px at 150px 70px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 230px 190px, #ffffff, rgba(0,0,0,0));
      background-size: 260px 260px;
      animation: fall 10s linear infinite;
      opacity: 0.45;
      z-index: 0;
    }

    @keyframes fall {
      from { transform: translateY(-260px); }
      to { transform: translateY(0); }
    }

    .hint {
      position: relative;
      z-index: 10;
      margin-bottom: 18px;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      color: #ffe8a3;
      text-align: center;
      animation: pulse 1.8s infinite ease-in-out;
      transition: opacity 0.4s ease;
    }

    .hint.hidden {
      opacity: 0;
      pointer-events: none;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .scene {
      position: relative;
      z-index: 5;
      width: min(92vw, 360px);
      height: 540px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      perspective: 1200px;
      cursor: pointer;
    }

    .envelope-back {
      position: relative;
      width: 100%;
      height: 240px;
      background: linear-gradient(145deg, #9b111e, #6b0811);
      border-radius: 12px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.75), inset 0 0 0 2px #d4af37;
    }

    .envelope-lining {
      position: absolute;
      inset: 6px;
      background: repeating-linear-gradient(
        45deg,
        #133a24,
        #133a24 10px,
        #194b2f 10px,
        #194b2f 20px
      );
      border-radius: 8px;
    }

    .card-wrapper {
      position: absolute;
      bottom: 14px;
      left: 50%;
      width: 90%;
      transform: translateX(-50%) translateY(0) scale(0.95);
      transform-origin: bottom center;
      transition: transform 1.1s cubic-bezier(0.22, 1, 0.36, 1), z-index 0.3s;
      z-index: 2;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 2px solid #f2cf66;
    }

    .card-wrapper img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 205px;
      object-fit: cover;
      object-position: top center;
      transition: max-height 1s ease;
    }

    .scene.open .card-wrapper {
      transform: translateX(-50%) translateY(-45px) scale(1.02);
      z-index: 8;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 25px rgba(255, 215, 0, 0.35);
    }

    .scene.open .card-wrapper img {
      max-height: 700px;
    }

    .envelope-front {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      overflow: hidden;
      border-radius: 12px;
    }

    .envelope-front::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #b31524 0%, #7d0a15 100%);
      clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
      border-bottom: 3px solid #d4af37;
    }

    .envelope-front::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(0,0,0,0.25), transparent 55%);
      clip-path: polygon(0 100%, 50% 48%, 100% 100%);
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 145px;
      background: linear-gradient(180deg, #c91829 0%, #8a0c18 100%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.4s;
      z-index: 6;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.45));
    }

    .scene.open .flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .seal {
      position: absolute;
      top: 112px;
      left: 50%;
      transform: translateX(-50%);
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffdf73, #c9961a 70%, #8c6208 100%);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.6), inset 0 0 0 4px rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      z-index: 7;
      transition: transform 0.5s ease, opacity 0.4s ease;
    }

    .scene.open .seal {
      transform: translateX(-50%) scale(0.4);
      opacity: 0;
      pointer-events: none;
    }

    .actions {
      position: relative;
      z-index: 10;
      margin-top: 22px;
      display: flex;
      gap: 12px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.5s ease 0.5s;
      pointer-events: none;
    }

    .actions.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .btn {
      padding: 11px 18px;
      border-radius: 999px;
      border: none;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      transition: transform 0.2s;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-close {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(6px);
    }

    .btn-wa {
      background: #25D366;
      color: #0b2e16;
    }
  </style>
</head>
<body>

  <div class="snow"></div>

  <!-- EDITA AQUÍ EL TEXTO DE ARRIBA -->
  <p class="hint" id="hint">✨ Toca el sello dorado para abrir el sobre sorpresa ✨</p>

  <div class="scene" id="envelopeScene" onclick="toggleEnvelope()">
    <div class="envelope-back">
      <div class="envelope-lining"></div>

      <div class="card-wrapper">
        <img src="invitacion.jpg" alt="Invitación ¡La Navidad Llegó a Casa! 2026" />
      </div>

      <div class="envelope-front"></div>
      <div class="flap"></div>
      <div class="seal">🎄</div>
    </div>
  </div>

  <div class="actions" id="actions">
    <button class="btn btn-close" onclick="toggleEnvelope()">Cerrar sobre</button>
    <button class="btn btn-wa" onclick="confirmarAsistencia()">Confirmar asistencia</button>
  </div>

  <script>
    const scene = document.getElementById('envelopeScene');
    const hint = document.getElementById('hint');
    const actions = document.getElementById('actions');

    function toggleEnvelope() {
      const isOpen = scene.classList.toggle('open');
      if (isOpen) {
        hint.classList.add('hidden');
        actions.classList.add('visible');
      } else {
        hint.classList.remove('hidden');
        actions.classList.remove('visible');
      }
    }

    function confirmarAsistencia() {
      const telefono = "526692689365";
      const mensaje = encodeURIComponent("🎄 ¡Hola! Confirmo mi asistencia a poner el pino navideño este domingo a las 5:00 pm. ¡Ahí nos vemos!");
      window.open(`https://wa.me/${telefono}?text=${mensaje}`, '_blank');
    }
  </script>

</body>
</html>
